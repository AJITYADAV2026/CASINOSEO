name: Publish daily CasinoVerse artifacts

on:
  schedule:
    # 02:35 IST. Agent 3 is scheduled for 02:30 IST; the polling loop waits
    # up to 25 minutes if its durable manifest is not ready yet.
    - cron: "5 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  statuses: read
  deployments: read

concurrency:
  group: casinoverse-daily-content-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for the complete durable Agent 1–3 chain
        env:
          PUBLICATION_ORIGIN: https://casinonews-flgw988r.manus.space
        run: |
          set -euo pipefail
          export TZ=Asia/Kolkata
          today="$(date +%F)"
          digest_date="$(date -d 'yesterday' +%F)"

          mkdir -p publication-artifacts/research \
            publication-artifacts/site-find \
            publication-artifacts/url-manifests

          ready=false
          for attempt in $(seq 1 25); do
            if curl --fail --silent --show-error \
                "$PUBLICATION_ORIGIN/research/$digest_date.md" \
                --output "publication-artifacts/research/$digest_date.md" \
              && curl --fail --silent --show-error \
                "$PUBLICATION_ORIGIN/site-find/$today.md" \
                --output "publication-artifacts/site-find/SITE FIND $today.md" \
              && curl --fail --silent --show-error \
                "$PUBLICATION_ORIGIN/url-manifests/$today.md" \
                --output "publication-artifacts/url-manifests/URL+$today.md"; then
              ready=true
              break
            fi

            echo "Durable Agent 1–3 chain is not complete yet (attempt $attempt/25)."
            sleep 60
          done

          if [[ "$ready" != "true" ]]; then
            echo "Agent 1–3 chain remained incomplete; refusing to commit stale or partial output."
            exit 1
          fi

          grep -Fqx "digestDate: \"$digest_date\"" "publication-artifacts/research/$digest_date.md"
          grep -Fqx 'status: "published"' "publication-artifacts/research/$digest_date.md"
          grep -Fqx "reportDate: \"$today\"" "publication-artifacts/site-find/SITE FIND $today.md"
          grep -Fqx "sourceDigestDate: \"$digest_date\"" "publication-artifacts/site-find/SITE FIND $today.md"
          grep -Fqx 'status: "completed"' "publication-artifacts/site-find/SITE FIND $today.md"
          grep -Fqx "manifestDate: \"$today\"" "publication-artifacts/url-manifests/URL+$today.md"
          grep -Fqx "sourceSiteFindDate: \"$today\"" "publication-artifacts/url-manifests/URL+$today.md"
          grep -Fqx 'status: "completed"' "publication-artifacts/url-manifests/URL+$today.md"

          curl --fail --silent --show-error \
            "$PUBLICATION_ORIGIN/sitemap.xml" \
            --output publication-artifacts/sitemap.xml

          cat > publication-artifacts/latest-run.json <<EOF
          {
            "publicationDateIst": "$today",
            "digestDateIst": "$digest_date",
            "sourceOrigin": "$PUBLICATION_ORIGIN",
            "agent1Artifact": "publication-artifacts/research/$digest_date.md",
            "agent2Artifact": "publication-artifacts/site-find/SITE FIND $today.md",
            "agent3Artifact": "publication-artifacts/url-manifests/URL+$today.md",
            "sitemapSnapshot": "publication-artifacts/sitemap.xml"
          }
          EOF

      - name: Commit and push only real daily changes
        id: publish
        run: |
          set -euo pipefail
          export TZ=Asia/Kolkata
          today="$(date +%F)"

          git config user.name "CasinoVerse Daily Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add publication-artifacts

          if git diff --cached --quiet; then
            echo "No new durable artifacts; nothing to commit."
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Automated daily content update: $today"
          git push origin HEAD:main
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel deployed the exact GitHub commit
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.published_sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$PUBLISHED_SHA/status")"
            vercel_state="$(jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "pending"' <<<"$status_json")"
            vercel_target="$(jq -r '[.statuses[] | select(.context == "Vercel")][0].target_url // ""' <<<"$status_json")"

            if [[ "$vercel_state" == "success" && "$vercel_target" == https://vercel.com/* ]]; then
              echo "Vercel successfully deployed GitHub commit $PUBLISHED_SHA."
              exit 0
            fi
            if [[ "$vercel_state" == "failure" || "$vercel_state" == "error" ]]; then
              echo "Vercel reported $vercel_state for GitHub commit $PUBLISHED_SHA."
              exit 1
            fi

            echo "Waiting for Vercel deployment of $PUBLISHED_SHA (attempt $attempt/30)."
            sleep 20
          done

          echo "Vercel did not confirm deployment of GitHub commit $PUBLISHED_SHA within 10 minutes."
          exit 1
