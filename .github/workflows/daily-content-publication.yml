name: Publish daily CasinoVerse artifacts

on:
  schedule:
    # 02:35 IST. Agent 3 is scheduled for 02:30 IST; the polling loop waits
    # up to 25 minutes if its durable manifest is not ready yet.
    - cron: "5 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: casinoverse-daily-content-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for the complete durable Agent 1–3 chain
        env:
          PUBLICATION_ORIGIN: https://casinonews-flgw988r.manus.space
        run: |
          set -euo pipefail
          export TZ=Asia/Kolkata
          today="$(date +%F)"
          digest_date="$(date -d 'yesterday' +%F)"

          mkdir -p publication-artifacts/research \
            publication-artifacts/site-find \
            publication-artifacts/url-manifests

          ready=false
          for attempt in $(seq 1 25); do
            if curl --fail --silent --show-error \
                "$PUBLICATION_ORIGIN/research/$digest_date.md" \
                --output "publication-artifacts/research/$digest_date.md" \
              && curl --fail --silent --show-error \
                "$PUBLICATION_ORIGIN/site-find/$today.md" \
                --output "publication-artifacts/site-find/SITE FIND $today.md" \
              && curl --fail --silent --show-error \
                "$PUBLICATION_ORIGIN/url-manifests/$today.md" \
                --output "publication-artifacts/url-manifests/URL+$today.md"; then
              ready=true
              break
            fi

            echo "Durable Agent 1–3 chain is not complete yet (attempt $attempt/25)."
            sleep 60
          done

          if [[ "$ready" != "true" ]]; then
            echo "Agent 1–3 chain remained incomplete; refusing to commit stale or partial output."
            exit 1
          fi

          curl --fail --silent --show-error \
            "$PUBLICATION_ORIGIN/sitemap.xml" \
            --output publication-artifacts/sitemap.xml

          cat > publication-artifacts/latest-run.json <<EOF
          {
            "publicationDateIst": "$today",
            "digestDateIst": "$digest_date",
            "sourceOrigin": "$PUBLICATION_ORIGIN",
            "agent1Artifact": "publication-artifacts/research/$digest_date.md",
            "agent2Artifact": "publication-artifacts/site-find/SITE FIND $today.md",
            "agent3Artifact": "publication-artifacts/url-manifests/URL+$today.md",
            "sitemapSnapshot": "publication-artifacts/sitemap.xml"
          }
          EOF

      - name: Commit and push only real daily changes
        run: |
          set -euo pipefail
          export TZ=Asia/Kolkata
          today="$(date +%F)"

          git config user.name "CasinoVerse Daily Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add publication-artifacts

          if git diff --cached --quiet; then
            echo "No new durable artifacts; nothing to commit."
            exit 0
          fi

          git commit -m "Automated daily content update: $today"
          git push origin HEAD:main
